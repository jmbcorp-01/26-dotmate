<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>.mate — 사업이 커지면, SaaS가 좁아집니다</title>
<meta name="description" content="범용 SaaS를 우리 사업 방식에 맞는 자체 시스템으로. 그 안에서 AI가 실제 업무를 맡습니다. .ax">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<style>
  :root{
    --paper:#FFFFFF; --ink:#000000; --red:#D82E28;
    --off:#C4C4C4; --soft:#6B6B6B;
    --font:"Wanted Sans Variable","Wanted Sans",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--font);word-break:keep-all;
       -webkit-font-smoothing:antialiased;font-feature-settings:"ss01"}
  a{color:inherit}
  ul,ol{list-style:none}
  :focus-visible{outline:3px solid var(--red);outline-offset:3px}

  .page{min-height:100vh;display:flex;flex-direction:column;padding:0 clamp(16px,4vw,64px)}

  header{display:flex;align-items:center;justify-content:space-between;height:88px}
  .logo img{height:26px;display:block}
  nav{display:flex;gap:clamp(18px,3vw,44px);font-size:16px;font-weight:600}
  nav a{text-decoration:none}
  nav a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
  nav a[aria-current]{text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:3px;text-underline-offset:6px}

  main{flex:1;display:grid;grid-template-columns:minmax(0,6fr) minmax(0,6fr);gap:clamp(32px,5vw,96px);
       align-items:center;padding:clamp(16px,3vh,40px) 0 clamp(32px,6vh,72px)}

  h1{font-size:clamp(40px,4.7vw,80px);line-height:1.06;font-weight:800;letter-spacing:-0.05em}
  .lead{margin-top:32px;font-size:clamp(17px,1.3vw,20px);line-height:1.65;font-weight:500;color:var(--soft);max-width:26em}
  .lead b{color:var(--ink);font-weight:700}
  .act{margin-top:44px;display:flex;flex-wrap:wrap;align-items:center;gap:16px 32px}
  .btn{display:inline-block;background:var(--ink);color:var(--paper);text-decoration:none;font-weight:700;font-size:17px;
       padding:20px 30px;border-radius:2px}
  .btn:hover{background:var(--red)}
  .txt{font-weight:600;text-underline-offset:6px;text-decoration-thickness:2px}
  .lines{margin-top:56px;display:flex;flex-wrap:wrap;gap:6px 26px;font-size:15px;font-weight:700}
  .lines a{text-decoration:none;color:var(--soft)}
  .lines a:hover{color:var(--ink)}
  .lines a[aria-current]{color:var(--ink)}
  .lines i{font-style:normal;color:var(--red)}

  /* ---------- stage ---------- */
  .stage{position:relative;display:grid;min-height:520px}
  .scene{grid-area:1/1;align-self:start}
  .cap{font-size:15px;font-weight:600;color:var(--soft);margin-bottom:22px;min-height:1.4em}
  .cap b{color:var(--ink)}

  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 20px;font-size:15px;font-weight:500}
  .grid li{padding:5px 0;white-space:nowrap;transition:color .18s}
  .grid li.off{color:var(--off)}
  .excel{margin-top:30px;padding:18px 20px;border:1.5px dashed var(--ink);opacity:0;transition:opacity .4s}
  .excel.on{opacity:1}
  .excel p{font-size:14px;font-weight:600;color:var(--soft);margin-bottom:10px}
  .excel ul{display:flex;flex-wrap:wrap;gap:6px 24px;font-size:15px;font-weight:600}

  .mark{font-size:clamp(30px,2.8vw,42px);font-weight:800;letter-spacing:-0.04em;margin-bottom:18px;opacity:0;line-height:1}
  .mark .d{display:inline-block;width:.3em;height:.3em;border-radius:50%;background:var(--red);margin-right:.04em;visibility:hidden}
  .final li{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 18px;padding:9px 0;border-bottom:1.5px solid var(--ink);opacity:0}
  .final li:first-child{border-top:1.5px solid var(--ink)}
  .final .n{font-size:clamp(22px,1.9vw,28px);font-weight:700;letter-spacing:-0.03em;position:relative}
  .final .ai{font-size:15px;font-weight:500;color:var(--soft);opacity:0;transition:opacity .4s}
  .final .ai::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:8px;vertical-align:1px}
  .final .ai.on{opacity:1}
  .sum{margin-top:18px;font-size:15px;font-weight:600;opacity:0;transition:opacity .4s}
  .sum.on{opacity:1}

  .dot{position:absolute;left:0;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--red);
       opacity:0;pointer-events:none;z-index:3}
  .ghost{position:absolute;white-space:nowrap;transform-origin:0 0;pointer-events:none;z-index:2;font-weight:600}
  .again{position:absolute;right:0;bottom:-36px;background:none;border:0;font:inherit;font-size:14px;font-weight:600;color:var(--soft);
         cursor:pointer;text-decoration:underline;text-underline-offset:5px}
  .again:hover{color:var(--ink)}

  @media (max-width:960px){
    main{grid-template-columns:1fr;align-items:start}
    .stage{min-height:0;margin-bottom:48px}
    .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:520px){
    header{height:68px}
    .logo img{height:20px}
    nav{font-size:14px;gap:16px}
    .grid{font-size:14px;gap:0 14px}
    .grid li{padding:4px 0}
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <a class="logo" href="/"><img src="assets/logo.png" alt=".mate 홈"></a>
    <nav aria-label="주 메뉴">
      <a href="/ax">AX전환?</a>
      <a href="/work">포트폴리오</a>
      <a href="/contact">문의하기</a>
    </nav>
  </header>

  <main>
    <section>
      <h1>사업이 커지면,<br>SaaS가 좁아집니다.</h1>
      <p class="lead"><b>.ax</b>는 우리 사업 방식대로 시스템을 다시 짓고, 그 안에서 AI가 실제 업무를 맡게 합니다. 사업이 커지면 시스템도 함께 커집니다.</p>
      <div class="act">
        <a class="btn" href="/contact">업무 진단 신청하기</a>
        <a class="txt" href="/ax">AX전환이 뭔가요?</a>
      </div>
      <nav class="lines" aria-label=".ax 라인업">
        <a href="/ax#commerce" aria-current="true"><i>.</i>ax commerce</a>
        <a href="/ax#erp"><i>.</i>ax erp</a>
        <a href="/ax#crm"><i>.</i>ax crm</a>
        <a href="/ax#edu"><i>.</i>ax edu</a>
      </nav>
    </section>

    <div class="stage" id="stage" role="img"
         aria-label="쇼핑몰 SaaS 관리자 메뉴 36개 중 25개는 쓰지 않고, 엑셀로 하던 업무 4개가 더해져 우리 회사 메뉴 8개가 됩니다. 그중 5개는 AI가 맡습니다.">
      <div class="scene" id="sa" aria-hidden="true">
        <p class="cap" id="capA"></p>
        <ul class="grid" id="grid"></ul>
        <div class="excel" id="excel">
          <p>메뉴에 없어서 엑셀로 하는 일</p>
          <ul id="xl"></ul>
        </div>
      </div>
      <div class="scene" id="sb" aria-hidden="true">
        <p class="mark" id="mark"><span class="d" id="markDot"></span>ax commerce</p>
        <ol class="final" id="final"></ol>
        <p class="sum" id="sum">우리 회사 메뉴 8개, 그중 5개는 AI가 맡습니다.</p>
      </div>
      <span class="dot" id="dot"></span>
      <button class="again" id="again" type="button">처음부터 다시 보기</button>
    </div>
  </main>
</div>

<script>
(() => {
  // ---- content (쇼핑몰 기준) ----
  const GENERIC = ["주문 관리","취소·교환·반품","배송 관리","상품 관리","상품 진열","카테고리",
    "재고 관리","회원 관리","회원 등급","적립금","쿠폰","이벤트",
    "기획전","게시판","블로그","상품 후기","1:1 문의","메일 발송",
    "SMS 발송","푸시 알림","정기배송","오픈마켓 연동","해외몰","다국어 설정",
    "디자인 편집","팝업 관리","배너 관리","SEO 설정","통계","매출 분석",
    "방문자 분석","정산 관리","세금계산서","부가서비스","앱 스토어","운영자 권한"];
  const EXCEL = ["도매 거래처별 단가","공동구매 정산","채널별 재고 통합","맞춤 제작 주문"];
  const FINAL = [
    { n:"주문 처리",       from:["주문 관리","배송 관리"],                  ai:"채널마다 들어온 주문을 모아 자동으로 분류합니다" },
    { n:"채널 통합 재고",   from:["재고 관리","오픈마켓 연동","해외몰","채널별 재고 통합"], ai:"품절되기 전에 발주를 제안합니다" },
    { n:"도매 거래처 단가", from:["도매 거래처별 단가"] },
    { n:"맞춤 제작 주문",   from:["맞춤 제작 주문"] },
    { n:"상품 관리",       from:["상품 관리"],                            ai:"상세페이지 초안과 해외몰 번역을 씁니다" },
    { n:"공동구매 정산",    from:["공동구매 정산"],                         ai:"판매 데이터로 정산서를 작성합니다" },
    { n:"고객 응대",       from:["1:1 문의","상품 후기","회원 관리"],        ai:"문의를 요약하고 답변 초안을 붙입니다" },
    { n:"매출·정산",       from:["정산 관리","매출 분석"] },
  ];
  const USED = new Set(FINAL.flatMap(f => f.from));

  const $ = id => document.getElementById(id);
  const stage = $("stage"), grid = $("grid"), xl = $("xl"), final = $("final"), dot = $("dot");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let run = 0;

  const wait = (ms, id) => new Promise((ok, no) => setTimeout(() => id === run ? ok() : no("stop"), ms));
  const local = el => { const s = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
    return { x: r.left - s.left, y: r.top - s.top, w: r.width, h: r.height }; };
  const anim = (el, kf, o) => el.animate(kf, { fill: "forwards", easing: "cubic-bezier(.65,0,.35,1)", ...o }).finished;
  let dotAt = { x: 0, y: 0 };
  const moveDot = (x, y, d) => { const a = anim(dot, [{ transform:`translate(${dotAt.x}px,${dotAt.y}px)` }, { transform:`translate(${x}px,${y}px)` }], { duration: d }); dotAt = { x, y }; return a; };

  function build() {
    grid.innerHTML = GENERIC.map(t => `<li>${t}</li>`).join("");
    xl.innerHTML = EXCEL.map(t => `<li>${t}</li>`).join("");
    final.innerHTML = FINAL.map(f => `<li><span class="n">${f.n}</span>${f.ai ? `<span class="ai">${f.ai}</span>` : ""}</li>`).join("");
    stage.querySelectorAll(".ghost").forEach(g => g.remove());
    $("sa").style.opacity = 1; $("excel").classList.remove("on");
    $("mark").style.opacity = 0; $("markDot").style.visibility = "hidden";
    $("sum").classList.remove("on");
    dot.getAnimations().forEach(a => a.cancel()); dot.style.opacity = 0;
    [...final.children].forEach(li => li.style.opacity = 0);
  }

  function finalState() {
    $("sa").style.opacity = 0; $("mark").style.opacity = 1; $("markDot").style.visibility = "visible";
    [...final.children].forEach(li => li.style.opacity = 1);
    final.querySelectorAll(".ai").forEach(a => a.classList.add("on"));
    $("sum").classList.add("on");
  }

  async function play() {
    const id = ++run;
    build();
    if (reduce) return finalState();
    const capA = $("capA");
    const items = [...grid.children], byText = {};
    items.forEach(li => byText[li.textContent] = li);

    capA.innerHTML = "쇼핑몰 SaaS 관리자 메뉴 <b>36개</b>";
    await anim($("sa"), [{ opacity: 0 }, { opacity: 1 }], { duration: 500 });
    await wait(900, id);

    // 1. red dot sweeps the menu, switching off what the business never uses
    const unused = items.filter(li => !USED.has(li.textContent));
    const p0 = local(unused[0]); dotAt = { x: p0.x - 14, y: p0.y + p0.h / 2 };
    dot.style.opacity = 1;
    await anim(dot, [{ transform:`translate(${dotAt.x}px,${dotAt.y}px) scale(0)` }, { transform:`translate(${dotAt.x}px,${dotAt.y}px) scale(1)` }], { duration: 220 });
    let off = 0;
    for (const li of unused) {
      const r = local(li);
      await moveDot(r.x - 14, r.y + r.h / 2, 85);
      li.classList.add("off"); off++;
      capA.innerHTML = `쇼핑몰 SaaS 관리자 메뉴 36개, 그중 쓰지 않는 메뉴 <b>${off}개</b>`;
    }
    await wait(500, id);

    // 2. the work that lives outside the system
    $("excel").classList.add("on");
    const xr = local($("excel"));
    await moveDot(xr.x + xr.w - 2, xr.y + 2, 380);
    capA.innerHTML = "정작 필요한 일은 <b>메뉴에 없습니다</b>";
    await wait(1600, id);

    // 3. rebuild: used menus + excel work fold into the company's own menu
    const sources = {};
    items.forEach(li => sources[li.textContent] = li);
    [...xl.children].forEach(li => sources[li.textContent] = li);
    const finals = [...final.children];
    const ghosts = [];
    FINAL.forEach((f, i) => {
      const target = finals[i].querySelector(".n"), tr = local(target);
      const tSize = parseFloat(getComputedStyle(target).fontSize);
      f.from.forEach(t => {
        const src = sources[t], sr = local(src);
        const g = document.createElement("span");
        g.className = "ghost"; g.textContent = t;
        const sSize = parseFloat(getComputedStyle(src).fontSize);
        g.style.cssText = `left:${sr.x}px;top:${sr.y + (src.closest(".grid") ? 5 : 0)}px;font-size:${sSize}px`;
        stage.appendChild(g);
        ghosts.push({ g, dx: tr.x - sr.x, dy: tr.y - sr.y - (src.closest(".grid") ? 5 : 0), s: tSize / sSize, i, multi: f.from.length > 1 });
      });
    });
    anim($("sa"), [{ opacity: 1 }, { opacity: 0 }], { duration: 300 });
    const tm = local($("markDot"));
    moveDot(tm.x + tm.w / 2, tm.y + tm.h / 2, 900);
    finals.forEach((li, i) => anim(li, [{ opacity: 0 }, { opacity: 1 }], { duration: 450, delay: i * 70 + 600 })
      .then(() => li.style.opacity = 1));
    await Promise.all(ghosts.map(({ g, dx, dy, s, i }) =>
      anim(g, [
        { transform: "translate(0,0) scale(1)", opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) scale(${s})`, opacity: 1, offset: .8 },
        { transform: `translate(${dx}px,${dy}px) scale(${s})`, opacity: 0 }
      ], { duration: 1050, delay: i * 70 })));
    ghosts.forEach(({ g }) => g.remove());
    $("mark").style.opacity = 1;
    $("markDot").style.visibility = "visible"; dot.style.opacity = 0;
    await wait(500, id);

    // 4. AI takes over specific work, one item at a time
    for (const a of final.querySelectorAll(".ai")) { a.classList.add("on"); await wait(380, id); }
    $("sum").classList.add("on");
  }

  $("again").addEventListener("click", () => play().catch(() => {}));
  // start when the stage is actually on screen (on phones it sits below the headline)
  build();
  const io = new IntersectionObserver(es => {
    if (es.some(e => e.isIntersecting)) { io.disconnect(); play().catch(() => {}); }
  }, { threshold: 0.35 });
  io.observe(stage);
})();
</script>
</body>
</html>
